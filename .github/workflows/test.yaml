name: Pipeline to build and push docker image
on:
    push
permissions:
  contents: write
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
               username: ${{ vars.DOCKERHUB_USERNAME }}
               password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Build and push
              uses: docker/build-push-action@v7
              with:
               push: true
             #  tags: sanojkv/app-github-actions:latest
               tags: sanojkv/app-github-actions:${{ github.sha }}
            - name: Update Kubernetes manifest
              run: |
                sed -i "s|IMAGE_TAG|${{ github.sha }}|g" pod.yaml
                cat pod.yaml
            - name: Commit and push manifesta
              run: |
               git config --global user.name "github-actions[bot]"
               git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

               git add pod.yaml
               git commit -m "Update image tag to ${{ github.sha }}" || echo "No changes to commit"
               git push
              
                         